<svg width="2048" height="1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Left side: Black gloss (will be rendered as black, glossiness comes from material) -->
  <rect x="0" y="0" width="1024" height="1024" fill="#000000"/>

  <!-- Right side: Purple background -->
  <rect x="1024" y="0" width="1024" height="1024" fill="#8b5cf6"/>

  <!-- Buttons on purple side -->

  <!-- App Store Button (styled badge) -->
  <rect x="1200" y="300" width="200" height="70" fill="#000000" rx="8"/>
  <text x="1300" y="330" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#ffffff" text-anchor="middle">Download on the</text>
  <text x="1300" y="355" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle"> App Store</text>

  <!-- Play Store Button (styled badge) -->
  <rect x="1200" y="400" width="200" height="70" fill="#000000" rx="8"/>
  <text x="1220" y="425" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="start">GET IT ON</text>
  <text x="1300" y="455" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Google Play</text>

  <!-- Browser Button -->
  <rect x="1200" y="500" width="200" height="70" fill="#8b5cf6" stroke="#00ff00" stroke-width="4" rx="8"/>
  <text x="1300" y="535" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="#00ff00" text-anchor="middle">Launch in</text>
  <text x="1300" y="560" font-family="Courier New, monospace" font-size="20" font-weight="bold" fill="#00ff00" text-anchor="middle">Browser</text>
</svg>
